${esc(g.names[g.next])} · $${g.chips[g.next]}</h2><small>Roll ${d} dice</small></div><div class=slots>${Array.from({length:d},(_,i)=>roll[i]==='K'?'●':roll[i]||'□').join(' ')}</div><div class=dice>${[['L','Left','#2563eb'],['R','Right','#9333ea'],['C','Center','#b91c1c'],['K','Keep','#166534']].map(([v,n,c])=>`<button data-die=${v} style="background:${c}" ${busy||roll.length>=d?'disabled':''}>${v==='K'?'●':v}<small>${n}</small></button>`).join('')}</div><div class=flex><button id=back ${!roll.length||busy?'disabled':''}>⌫</button><button class=primary id=confirm ${busy||roll.length!==d?'disabled':''}>Confirm</button></div>`}</section>`;$('#tv-margin').onclick=cycleTvMargin;$('#new').onclick=setup;$('#archive').onclick=showArchive;$('#undo').onclick=undo;document.querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>{roll.push(b.dataset.die);render()});document.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{let i=+b.dataset.line;hidden.has(i)?hidden.delete(i):hidden.add(i);render()});if($('#back'))$('#back').onclick=()=>{roll.pop();render()};if($('#confirm'))$('#confirm').onclick=commit;if($('#rematch'))$('#rematch').onclick=()=>start(g.names.slice());setTvMargin();draw(g.history,g.names)}
